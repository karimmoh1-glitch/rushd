<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Production CSP is set in src-tauri/tauri.conf.json (app.security.csp). -->
    <title>Rushd</title>
    <link rel="stylesheet" href="style.css" />
    <script src="launcher.js" defer></script>
  </head>
  <body data-state="connecting">
    <main>
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M5 24.5C9.5 21.5 12 18.5 17 16.5S23.5 11 25.5 8.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        <circle cx="5" cy="24.5" r="2.3" fill="currentColor" />
        <circle cx="11" cy="20" r="2.3" fill="currentColor" />
        <circle cx="17" cy="16.5" r="2.3" fill="currentColor" />
        <circle cx="25.5" cy="8.5" r="3.8" fill="var(--signal)" />
      </svg>

      <section class="connecting" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p>Connecting to Rushd…</p>
      </section>

      <section class="offline" aria-live="polite">
        <h1>Can't reach Rushd</h1>
        <p>Rushd for desktop needs an internet connection. Check your connection and try again.</p>
        <button id="retry" type="button">Try again</button>
        <p class="hint" id="detail"></p>
      </section>
    </main>
  </body>
</html>
