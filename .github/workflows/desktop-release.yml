name: Desktop release

# Builds the Rushd desktop app (desktop/, Tauri v2) for macOS and Windows.
#
# - Push a tag `desktop-vX.Y.Z` (X.Y.Z must equal desktop/src-tauri/tauri.conf.json
#   "version") to build and publish a GitHub pre-release with the installers.
# - Run manually (workflow_dispatch) to build test installers as workflow artifacts
#   without creating a release.
#
# Code signing is optional: every signing secret below may be absent, in which case
# the build still succeeds and produces UNSIGNED test builds (see desktop/README.md).

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
            artifact-glob: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows x64
            platform: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            args: --bundles nsis,msi
            artifact-glob: |
              desktop/src-tauri/target/release/bundle/nsis/*.exe
              desktop/src-tauri/target/release/bundle/msi/*.msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#desktop-v}"
          app_version="$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")"
          if [ "$tag_version" != "$app_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match desktop/src-tauri/tauri.conf.json version $app_version"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Rust unit tests (navigation policy)
        working-directory: desktop/src-tauri
        run: cargo test --locked

      # Tauri treats an env var that is SET but EMPTY as "configured" (e.g. it would try
      # to import an empty APPLE_CERTIFICATE). Unconfigured secrets expand to "", so
      # only export the ones that actually have a value.
      - name: Export configured signing secrets
        shell: bash
        env:
          S_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          S_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          S_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          S_APPLE_ID: ${{ secrets.APPLE_ID }}
          S_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          S_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          S_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          S_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          names="TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          if [ "$RUNNER_OS" = "macOS" ]; then
            names="$names APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID"
          fi
          for name in $names; do
            src="S_$name"
            value="${!src}"
            if [ -n "$value" ]; then
              delim="EOF_$(openssl rand -hex 8)"
              { echo "$name<<$delim"; echo "$value"; echo "$delim"; } >> "$GITHUB_ENV"
              echo "$name: configured"
            else
              echo "$name: not configured"
            fi
          done

      # Optional Windows Authenticode signing with a .pfx certificate. Secrets:
      #   WINDOWS_CERTIFICATE           base64 of the .pfx file
      #   WINDOWS_CERTIFICATE_PASSWORD  its password
      # When absent, the installers are built unsigned.
      - name: Import Windows signing certificate (optional)
        id: wincert
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE)) {
            Write-Host "WINDOWS_CERTIFICATE not configured: building unsigned installers."
            "config-args=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "rushd-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $config = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm       = "sha256"
            timestampUrl          = "http://timestamp.digicert.com"
          } } } | ConvertTo-Json -Compress -Depth 5
          $configPath = Join-Path $env:RUNNER_TEMP "windows-signing.json"
          Set-Content -Path $configPath -Value $config -Encoding utf8
          Write-Host "Windows signing certificate imported (thumbprint $($cert.Thumbprint))."
          "config-args=--config $($configPath -replace '\\','/')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build (and publish release on tag push)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }} ${{ steps.wincert.outputs.config-args }}
          # Release fields are only set for tag pushes; a manual run just builds.
          tagName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && 'Rushd Desktop v__VERSION__' || '' }}
          releaseBody: |
            Rushd for desktop: a native window for the Rushd web app (https://therushd.com). Requires an internet connection.

            Test build. Unless this release says otherwise, these installers are NOT code-signed:
            - macOS: open the .dmg, drag Rushd to Applications, then open it once via System Settings > Privacy & Security > "Open Anyway" (or right-click > Open on older macOS).
            - Windows: if SmartScreen appears, choose "More info" > "Run anyway".
          releaseDraft: false
          prerelease: true
          # e.g. Rushd_0.1.0_macos_universal.dmg, Rushd_0.1.0_windows_x64-setup.exe, Rushd_0.1.0_windows_x64.msi
          assetNamePattern: "[name]_[version]_[platform]_[arch][setup][ext]"

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v5
        with:
          name: rushd-desktop-${{ runner.os }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error
          retention-days: 14
